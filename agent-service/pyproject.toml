[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "noping-agent-service"
version = "0.1.0"
description = "NoPing permission-aware enterprise agent runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.10",
  "httpx>=0.28"
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]
google = [
  "google-adk[gcp]>=2.6,<3",
  "google-cloud-firestore>=2.20",
  "google-auth>=2.40",
  "google-cloud-pubsub>=2.28",
  "google-cloud-logging>=3.12",
  "opentelemetry-sdk>=1.30"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
