name: noping-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
      POSTGRES_DB: mattermost
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noping -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  mattermost:
    image: ${MATTERMOST_IMAGE:?missing MATTERMOST_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8065"
    ports:
      - "127.0.0.1:8065:8065"
    environment:
      TZ: UTC
      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_SITE_URL:?missing MATTERMOST_SITE_URL}
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "false"
      MM_TEAMSETTINGS_SITENAME: NoBS
      MM_TEAMSETTINGS_CUSTOMDESCRIPTIONTEXT: Fewer pings. Shorter meetings. More actual work.
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      MM_TEAMSETTINGS_ENABLEUSERCREATION: "false"
      MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL: "false"
      MM_EMAILSETTINGS_ENABLEPREVIEWMODEBANNER: "false"
      MM_SERVICESETTINGS_ENABLEEMAILINVITATIONS: "false"
      MM_RATELIMITSETTINGS_ENABLE: "true"
      MM_RATELIMITSETTINGS_PERSEC: "20"
      # Mattermost's code-split web client fetches many static chunks at once.
      # Keep sustained traffic low while allowing one legitimate cold page load.
      MM_RATELIMITSETTINGS_MAXBURST: "250"
      MM_RATELIMITSETTINGS_MEMORYSTORESIZE: "1000"
      MM_RATELIMITSETTINGS_VARYBYREMOTEADDR: "true"
      MM_RATELIMITSETTINGS_VARYBYUSER: "true"
      MM_RATELIMITSETTINGS_VARYBYHEADER: X-Forwarded-For
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://noping:${POSTGRES_PASSWORD}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS: "false"
      MM_FILESETTINGS_MAXFILESIZE: "67108864"
      MM_LOGSETTINGS_ENABLECONSOLE: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
      MM_LOGSETTINGS_CONSOLEJSON: "true"
      NOPING_AGENT_SERVICE_URL: ${NOPING_AGENT_SERVICE_URL:?missing NOPING_AGENT_SERVICE_URL}
      NOPING_CLOUD_RUN_AUDIENCE: ${NOPING_CLOUD_RUN_AUDIENCE:?missing NOPING_CLOUD_RUN_AUDIENCE}
      NOPING_SERVICE_SIGNING_SECRET: ${NOPING_SERVICE_SIGNING_SECRET:?missing NOPING_SERVICE_SIGNING_SECRET}
      NOPING_USE_GOOGLE_IDENTITY: "true"
      NOPING_DEMO_MODE: "false"
      NOPING_PUBLIC_DEMO_LOGIN: ${NOPING_PUBLIC_DEMO_LOGIN:-true}
      NOPING_DEMO_LOGIN_USERNAME: ${NOPING_DEMO_LOGIN_USERNAME:-maya}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?missing GOOGLE_CLOUD_PROJECT}
      NOPING_PUBSUB_TOPIC: ${NOPING_PUBSUB_TOPIC:-noping-work-events}
      NOPING_GITHUB_WEBHOOK_SECRET: ${NOPING_GITHUB_WEBHOOK_SECRET:?missing NOPING_GITHUB_WEBHOOK_SECRET}
      NOPING_GITHUB_IDENTITY_MAP: ${NOPING_GITHUB_IDENTITY_MAP:?missing NOPING_GITHUB_IDENTITY_MAP}
      NOPING_GITHUB_REPOSITORY_MAP: ${NOPING_GITHUB_REPOSITORY_MAP:?missing NOPING_GITHUB_REPOSITORY_MAP}
      NOPING_GOOGLE_CALENDAR_CREDENTIALS_B64: ${NOPING_GOOGLE_CALENDAR_CREDENTIALS_B64:-}
      NOPING_GOOGLE_CALENDAR_IDENTITY_MAP: ${NOPING_GOOGLE_CALENDAR_IDENTITY_MAP:?missing NOPING_GOOGLE_CALENDAR_IDENTITY_MAP}
      NOPING_GOOGLE_CALENDAR_ID: ${NOPING_GOOGLE_CALENDAR_ID:-primary}
      NOPING_GOOGLE_CALENDAR_POLL_MINUTES: ${NOPING_GOOGLE_CALENDAR_POLL_MINUTES:-5}
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client/plugins
      - mattermost-bleve:/mattermost/bleve-indexes
      - ./plugin-bundle:/plugin-bundle:ro
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      mattermost:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NOPING_SITE_ADDRESS: ${NOPING_SITE_ADDRESS:-:80}
      NOPING_LEGACY_IP: ${NOPING_LEGACY_IP:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./login:/srv/noping-login:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:
  mattermost-config:
  mattermost-data:
  mattermost-logs:
  mattermost-plugins:
  mattermost-client-plugins:
  mattermost-bleve:
  caddy-data:
  caddy-config:
