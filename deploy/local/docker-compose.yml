name: noping

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mattermost}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-mattermost}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options:
        max-size: 10m
        max-file: "3"

  agent-service:
    build:
      context: ../..
      dockerfile: agent-service/Dockerfile
      args:
        INSTALL_GOOGLE: "false"
    restart: unless-stopped
    environment:
      NOPING_DEMO_MODE: "true"
      NOPING_AI_ENABLED: "true"
      NOPING_SERVICE_SIGNING_SECRET: ${NOPING_SERVICE_SIGNING_SECRET:?set NOPING_SERVICE_SIGNING_SECRET}
      NOPING_PERSISTENCE_BACKEND: memory
      NOPING_ORGANIZATION_ID: acme
      NOPING_MAX_USER_PER_MINUTE: "3"
      NOPING_MAX_USER_PER_HOUR: "20"
      NOPING_MAX_USER_PER_DAY: "20"
      NOPING_MAX_ORG_PER_MINUTE: "10"
      NOPING_MAX_ORG_PER_DAY: "60"
      NOPING_MAX_CONCURRENT_RUNS: "2"
      NOPING_MODEL_MAX_CALLS_PER_QUERY: "4"
      NOPING_MODEL_MAX_INPUT_TOKENS_PER_QUERY: "24000"
      NOPING_MODEL_MAX_OUTPUT_TOKENS_PER_QUERY: "2400"
      NOPING_MODEL_MAX_CALLS_PER_DAY: "200"
      NOPING_MODEL_MAX_INPUT_TOKENS_PER_DAY: "1000000"
      NOPING_MODEL_MAX_OUTPUT_TOKENS_PER_DAY: "100000"
    expose:
      - "8080"
    logging:
      options:
        max-size: 10m
        max-file: "3"

  mattermost:
    image: ${MATTERMOST_IMAGE:-mattermost/mattermost-team-edition:11.10.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    ports:
      - "8065:8065"
    environment:
      TZ: UTC
      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_SITE_URL:-http://localhost:8065}
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "true"
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mattermost}?sslmode=disable&connect_timeout=10
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS: "false"
      MM_FILESETTINGS_MAXFILESIZE: "10485760"
      MM_LOGSETTINGS_ENABLECONSOLE: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
      MM_LOGSETTINGS_CONSOLEJSON: "true"
      NOPING_AGENT_SERVICE_URL: http://agent-service:8080
      NOPING_SERVICE_SIGNING_SECRET: ${NOPING_SERVICE_SIGNING_SECRET:?set NOPING_SERVICE_SIGNING_SECRET}
      NOPING_USE_GOOGLE_IDENTITY: "false"
      NOPING_DEMO_MODE: "true"
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client/plugins
      - mattermost-bleve:/mattermost/bleve-indexes
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8065/api/v4/system/ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:
  mattermost-config:
  mattermost-data:
  mattermost-logs:
  mattermost-plugins:
  mattermost-client-plugins:
  mattermost-bleve:
